name: Discord Notify

on:
  push:
  release:
    types: [published]
  issues:
    types: [opened, closed]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send notification to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK || vars.DISCORD_WEBHOOK }}
        run: |
          node -e '
          const https = require("https");
          const evName = process.env.GITHUB_EVENT_NAME;
          const repo = process.env.GITHUB_REPOSITORY;
          const actor = process.env.GITHUB_ACTOR;
          const ev = require(process.env.GITHUB_EVENT_PATH);
          let title = "Event: " + evName;
          let description = "";
          let url = process.env.GITHUB_SERVER_URL + "/" + repo;
          if (evName === "push") {
            const c = ev.commits && ev.commits[0];
            title = "Push";
            description = c ? c.message : "no commits";
            url = c ? c.url : url;
          } else if (evName === "release") {
            title = "Release: " + ev.release.tag_name;
            description = ev.release.name + "\n" + (ev.release.body || "");
            url = ev.release.html_url;
          } else if (evName === "issues") {
            title = "Issue " + (ev.action === "closed" ? "closed" : "opened");
            description = "#" + ev.issue.number + " " + ev.issue.title;
            url = ev.issue.html_url;
          } else if (evName === "issue_comment") {
            title = "Comment";
            description = ev.comment.body;
            url = ev.comment.html_url;
          }
          const payload = {
            username: "Modded OpenCode",
            embeds: [{
              title: repo,
              description: String(description).slice(0, 1900),
              url: url,
              color: 5793266,
              footer: { text: evName + " by " + actor }
            }]
          };
          const data = JSON.stringify(payload);
          const u = new URL(process.env.WEBHOOK);
          const req = https.request({
            hostname: u.hostname, path: u.pathname + u.search, method: "POST",
            headers: { "Content-Type": "application/json", "Content-Length": Buffer.byteLength(data) }
          }, (r) => { console.log("discord status:", r.statusCode); r.resume(); });
          req.on("error", (e) => console.error("discord error:", e.message));
          req.write(data);
          req.end();
          '
